# QBIT Connect — production reverse proxy (Phase 12 §9, §10)
#
# Architecture (brief §51):
#
#   Internet ──HTTPS──> nginx (this file, TLS termination)
#                          │
#                          ├── qbit-api   (FastAPI, 127.0.0.1:8000)
#                          └── static/UI  (served by qbit-api itself)
#
#   PostgreSQL / Redis / workers are NEVER exposed publicly — they live on
#   the docker `qbit-internal` network (docker-compose.yml).
#
# Install:
#   - copy to /etc/nginx/sites-available/qbit.conf, adjust server_name
#   - TLS certs via `certbot --nginx` (Let's Encrypt) or your own CA
#   - `nginx -t && systemctl reload nginx`
#
# HTTPS (§9):
#   - TLS terminates here; the app receives plain HTTP on the private network
#   - X-Forwarded-Proto lets FastAPI/uvicorn rebuild absolute URLs correctly
#   - HSTS is ENABLED ONLY after you have confirmed HTTPS works end-to-end
#     (uncomment the Strict-Transport-Security header below; §9: "HSTS only
#     when the deployment is ready for it")

# --- HTTP → HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name qbit.example.com;

    # ACME challenge must stay reachable over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qbit.example.com;

    # --- TLS (§9) -------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/qbit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qbit.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — enable ONLY after HTTPS is verified end-to-end (§9):
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- security headers (defense in depth; the app also sets them) ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- request limits (§37) ---------------------------------------------------
    client_max_body_size 110m;      # QBIT_MAX_UPLOAD_MB (100) + headroom
    client_body_timeout  60s;
    client_header_timeout 30s;

    # --- timeouts (§10) ---------------------------------------------------------
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    120s;

    # --- proxy behavior ---------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Proxy headers (§10): preserve client identity + scheme
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/streaming-friendly (job live polls use fetch polling today;
        # this keeps the door open for SSE/WebSocket without changes)
        proxy_buffering off;
        proxy_set_header Connection "";

        # Never cache authenticated UI/API responses at the proxy
        proxy_cache_bypass $http_authorization;
        add_header Cache-Control "no-store" always;
    }

    # Static assets can be cached safely
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Block obvious junk paths early (the API answers 404 anyway)
    location ~ /(\.git|\.env|composer\.(json|lock)|package(-lock)?\.json)$ {
        return 404;
    }
}

# ----------------------------------------------------------------------
# uvicorn must TRUST this proxy for correct client IPs (rate limiting,
# audit trails). Run the API with:
#   --proxy-headers --forwarded-allow-ips 127.0.0.1
# (127.0.0.1 = this nginx; the compose file keeps db/redis unexposed.)
# ----------------------------------------------------------------------
