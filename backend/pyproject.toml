[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qbit-connect-backend"
version = "0.13.0"
description = "QBIT Connect — self-hosted data & marketing operations platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "redis>=5.0",
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
