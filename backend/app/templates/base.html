<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}QBIT Connect{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/qbit.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">Q</span>
      <span class="brand-name">QBIT <em>CONNECT</em></span>
    </div>
    <nav>
      <a href="/leads" class="nav-item {% block nav_leads %}{% endblock %}">
        <span class="nav-ico">&#9670;</span> Leads
      </a>
      <a href="/leads/import" class="nav-item {% block nav_imports %}{% endblock %}">
        <span class="nav-ico">&#8613;</span> Imports
      </a>
      <a href="/leads/exports" class="nav-item {% block nav_exports %}{% endblock %}">
        <span class="nav-ico">&#8615;</span> Exports
      </a>
      <a href="/scraping" class="nav-item {% block nav_scrapers %}{% endblock %}">
        <span class="nav-ico">&#9881;</span> Scrapers
      </a>
      <a href="/scraping/jobs" class="nav-item {% block nav_jobs %}{% endblock %}">
        <span class="nav-ico">&#9203;</span> Jobs
      </a>
      <a href="/scraping/jobs?status=COMPLETED" class="nav-item {% block nav_results %}{% endblock %}">
        <span class="nav-ico">&#9636;</span> Results
      </a>
      <a href="/campaigns" class="nav-item {% block nav_campaigns %}{% endblock %}">
        <span class="nav-ico">&#9993;</span> Campaigns
      </a>
      <a href="/connections" class="nav-item {% block nav_connections %}{% endblock %}">
        <span class="nav-ico">&#9642;</span> Connections
      </a>
      <a href="/inbox" class="nav-item {% block nav_inbox %}{% endblock %}">
        <span class="nav-ico">&#9992;</span> Inbox
        <span id="inbox-unread-badge" class="nav-badge" hidden></span>
      </a>
      <a href="/automation" class="nav-item {% block nav_automation %}{% endblock %}">
        <span class="nav-ico">&#9881;</span> Automation
      </a>
      <a href="/analytics" class="nav-item {% block nav_analytics %}{% endblock %}">
        <span class="nav-ico">&#9635;</span> Analytics
      </a>
      <span class="nav-item nav-disabled" title="Planned for a later phase">Settings</span>
    </nav>
    <div class="sidebar-foot">
      {% if user %}
        <div class="user-chip">{{ user.full_name or user.email }}</div>
        <form method="post" action="/logout"><button class="btn btn-ghost btn-sm">Sign out</button></form>
      {% endif %}
    </div>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
{% block scripts %}{% endblock %}
{% if user %}
<script>
// Phase 8 §36: sidebar unread badge — real database values via /ui/inbox/counters
(function () {
  var badge = document.getElementById("inbox-unread-badge");
  if (!badge) return;
  function tick() {
    fetch("/ui/inbox/counters").then(function (r) { return r.ok ? r.json() : null; })
      .then(function (payload) {
        if (!payload || !payload.success) return;
        var total = (payload.data && payload.data.total) || 0;
        badge.textContent = total > 0 ? String(total) : "";
        badge.hidden = total === 0;
      }).catch(function () {});
  }
  tick();
  setInterval(tick, 12000);
})();
</script>
{% endif %}
</body>
</html>
